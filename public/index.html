<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="A simple VOO market price and news dashboard."
  />
  <title>VOO Dashboard</title>

  <style>
    :root {
      --background: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #facc15;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      color: var(--text);
      background: var(--background);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 38px);
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .market-status {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(30, 41, 59, 0.8);
      font-size: 13px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
      gap: 18px;
    }

    .card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
    }

    .card h2 {
      margin: 0 0 20px;
      font-size: 20px;
    }

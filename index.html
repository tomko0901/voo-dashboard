<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOO Dashboard Test</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fb;
  color: #172033;
  font-family: Arial, sans-serif;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 22px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 15px;
  flex-wrap: wrap;
}

h1 {
  margin: 0;
  font-size: 25px;
}

h2 {
  margin-top: 0;
}

#price {
  font-size: 24px;
  font-weight: bold;
}

#change {
  margin-left: 8px;
  color: #138a4b;
}

.controls {
  margin: 18px 0 10px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  border: 1px solid #ccd3df;
  background: white;
  border-radius: 7px;
  padding: 7px 13px;
  cursor: pointer;
}

button.active,
button:hover {
  background: #1f6feb;
  color: white;
}

.card {
  background: white;
  border: 1px solid #e1e6ef;
  border-radius: 12px;
  padding: 16px;
  margin-top: 14px;
}

#chart {
  width: 100%;
  height: 330px;
  display: block;
}

.news {
  border-bottom: 1px solid #edf0f5;
  padding: 10px 0;
}

.news:last-child {
  border-bottom: 0;
}

.news a {
  color: #155dcc;
  text-decoration: none;
  font-weight: bold;
}

.news a:hover {
  text-decoration: underline;
}

small,
.status {
  color: #687386;
  font-size: 13px;
}

@media (max-width: 700px) {
  #chart {
    height: 250px;
  }
}
</style>
</head>

<body>
<main>

<header>
  <div>
    <h1>VOO Dashboard Test</h1>
    <small>Static test version - no API request</small>
  </div>

  <div>
    <span id="price">$482.31</span>
    <span id="change">+0.82%</span>
  </div>
</header>

<div class="controls">
  <button data-range="1M">1M</button>
  <button data-range="3M">3M</button>
  <button data-range="6M">6M</button>
  <button data-range="1Y" class="active">1Y</button>
  <button data-range="5Y">5Y</button>
  <button data-range="MAX">MAX</button>
</div>

<section class="card">
  <svg id="chart" viewBox="0 0 900 330"
       preserveAspectRatio="none"
       aria-label="VOO sample price chart">
  </svg>

  <div id="chartStatus" class="status">
    Sample data only. No external data request.
